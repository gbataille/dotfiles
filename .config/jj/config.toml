[user]
name = "Grégory Bataille"
email = "gregory.bataille@lightframe.tech"
[signing]
behavior = "own"
backend = "gpg"
key = "16E3480ED00E3E09C7551C25CBD61BDEF9DB4581"

[ui]
default-command = "log"
merge-editor = "vimdiff"
diff-editor = ":builtin"
conflict-marker-style = "snapshot"

[merge-tools.vimdiff]
program = "nvim"

[git]
subprocess = true

[remotes.origin]
auto-track-bookmarks = "main"

[aliases]
landed = ["util", "exec", "--", "bash", "-c", '''
set -e
merged="${1:?usage: jj landed <bookmark>}"
jj git fetch --branch main
jj rebase -s \"${merged}+\" -d main
jj git fetch
jj bookmark delete \"$merged\" || true
''', "jj-landed"]
